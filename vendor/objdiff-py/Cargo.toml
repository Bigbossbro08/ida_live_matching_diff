[package]
name = "objdiff-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "objdiff_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
object = { version = "0.36", features = ["write", "coff"] }
objdiff-core = { path = "../objdiff/objdiff-core", default-features = false, features = ["std", "x86"] }
anyhow = "1.0"
